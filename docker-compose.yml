services:
  notetask:
    build: .
    container_name: notetask
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NOTEBOOK_DB: /data/notetask.db
      NOTEBOOK_DATA: /data
      NOTEBOOK_PORT: "8100"
    volumes:
      - ./data:/data
      - ./static:/app/static:ro
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
    ports:
      # localhost for Caddy; LAN IP for home Wi‑Fi when public DNS hits hairpin dead-end
      - "127.0.0.1:8100:8100"
      - "192.168.0.6:8100:8100"
