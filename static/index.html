<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NoteTask — todo.baski.pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;650;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var p = location.pathname;
      var base = (p === "/todo" || p.startsWith("/todo/")) ? "/todo/" : "/";
      document.write('<base href="' + base + '" id="app-base" />');
      window.NOTETASK_BASE = base === "/todo/" ? "/todo" : "";
    })();
  </script>
  <link rel="stylesheet" href="assets/styles.css?v=27" />
  <script src="assets/pwa.js?v=1"></script>
</head>
<body>
  <div id="login" class="login-wrap">
    <form class="login-card" id="login-form">
      <h1>NoteTask</h1>
      <p>Задачи, идеи, тренировки и история — всё на todo.baski.pro</p>
      <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required />
      <button class="btn" type="submit">Войти</button>
      <div class="error hidden" id="login-error">Неверный пароль</div>
    </form>
  </div>

  <div id="app" class="app-shell hidden">
    <aside class="sidebar">
      <h2 class="brand">Note<span>Task</span></h2>
      <p class="tagline">личное · с историей</p>
      <nav class="nav" id="nav">
        <button data-view="today" class="active">Сегодня</button>
        <button data-view="history">История</button>
        <button data-view="stats">Статистика</button>
      </nav>
      <p class="nav-label">Разделы</p>
      <nav class="nav nav-projects" id="project-nav"></nav>
      <div style="margin-top:28px">
        <button class="btn ghost" id="backup-btn" style="width:100%">Экспорт JSON</button>
        <button class="btn ghost" id="logout-btn" style="width:100%;margin-top:8px">Выйти</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-head">
          <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Скрыть меню" aria-expanded="true" title="Скрыть меню">
            <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9.5 3.5 8.8 4.2 12.6 8 8.8 11.8l.7.7 4.5-4.5-4.5-4.5zm-5 0L3.8 4.2 7.6 8 3.8 11.8l.7.7L9 8 4.5 3.5z"/></svg>
          </button>
          <h1 id="view-title">Сегодня</h1>
        </div>
      </div>

      <div class="workspace" id="workspace">
      <section id="view-tasks" class="panel">
        <button type="button" class="task-add-trigger" id="task-add-trigger" aria-label="Добавить задачу">+</button>
        <form class="composer hidden" id="task-form">
          <div class="composer row task-composer">
            <div class="task-composer-body">
              <div class="task-title-wrap">
                <div class="task-title-highlight" id="task-title-highlight" aria-hidden="true"></div>
                <input type="text" id="task-title" class="task-title-input" placeholder="Новая задача или идея… p1 завтра #тема @inbox" required autocomplete="off" spellcheck="false" />
              </div>
              <div class="task-chips" id="task-chips">
                <div class="chip-popover">
                  <button type="button" class="chip-btn" id="chip-kind" aria-expanded="false" aria-controls="pop-kind">
                    <span class="chip-icon" aria-hidden="true">
                      <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M2 3.5h12v1.2H2V3.5zm0 3.8h12v1.2H2V7.3zm0 3.8h8v1.2H2v-1.2z"/></svg>
                    </span>
                    <span class="chip-label" id="chip-kind-label">Задача</span>
                  </button>
                  <div class="chip-menu hidden" id="pop-kind" role="menu">
                    <button type="button" class="chip-option" data-set-kind="task" role="menuitem">Задача</button>
                    <button type="button" class="chip-option" data-set-kind="idea" role="menuitem">Идея</button>
                    <button type="button" class="chip-option" data-set-kind="plan" role="menuitem">План</button>
                  </div>
                  <select id="task-kind" class="hidden" tabindex="-1" aria-hidden="true">
                    <option value="task">Задача</option>
                    <option value="idea">Идея</option>
                    <option value="plan">План</option>
                  </select>
                </div>

                <div class="chip-popover">
                  <button type="button" class="chip-btn" id="chip-priority" aria-expanded="false" aria-controls="pop-priority">
                    <span class="chip-icon" aria-hidden="true">
                      <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M3 2.5l5 2.8 5-2.8v11L8 10.7 3 13.5V2.5z"/></svg>
                    </span>
                    <span class="chip-label" id="chip-priority-label">P4</span>
                  </button>
                  <div class="chip-menu hidden" id="pop-priority" role="menu">
                    <div class="priority-picker">
                      <button type="button" class="chip-option p4" data-set-priority="4" role="menuitem">P4</button>
                      <button type="button" class="chip-option p3" data-set-priority="3" role="menuitem">P3</button>
                      <button type="button" class="chip-option p2" data-set-priority="2" role="menuitem">P2</button>
                      <button type="button" class="chip-option p1" data-set-priority="1" role="menuitem">P1</button>
                    </div>
                  </div>
                  <select id="task-priority" class="hidden" tabindex="-1" aria-hidden="true">
                    <option value="4">P4</option>
                    <option value="3">P3</option>
                    <option value="2">P2</option>
                    <option value="1">P1</option>
                  </select>
                </div>

                <div class="chip-popover">
                  <button type="button" class="chip-btn" id="chip-due" aria-expanded="false" aria-controls="pop-due">
                    <span class="chip-icon" aria-hidden="true">
                      <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M3 2h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm1 2v1h1V4h6v1h1V4h1v2H4V4zm0 4h8v1H4V8z"/></svg>
                    </span>
                    <span class="chip-label" id="chip-due-label">Срок</span>
                  </button>
                  <div class="chip-menu chip-menu-wide hidden" id="pop-due" role="dialog" aria-label="Срок">
                    <input type="date" id="task-due" />
                    <div class="due-quick">
                      <button type="button" class="chip-option" data-composer-quick-due="tomorrow">Завтра</button>
                      <button type="button" class="chip-option" data-composer-quick-due="weekend">На выходных</button>
                      <button type="button" class="chip-option" data-composer-quick-due="next_week">На след. неделе</button>
                      <button type="button" class="chip-option" data-composer-quick-due="next_month">Через месяц</button>
                    </div>
                    <button type="button" class="chip-clear" data-clear="task-due">Без срока</button>
                  </div>
                </div>

                <div class="chip-popover">
                  <button type="button" class="chip-btn" id="chip-remind" aria-expanded="false" aria-controls="pop-remind">
                    <span class="chip-icon" aria-hidden="true">
                      <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 1.5a4.5 4.5 0 0 0-4.5 4.5v2.1L2 10.5h12l-1.5-2.4V6A4.5 4.5 0 0 0 8 1.5zm-2.2 11h4.4a1.6 1.6 0 0 1-4.4 0z"/></svg>
                    </span>
                    <span class="chip-label" id="chip-remind-label">Напомн.</span>
                  </button>
                  <div class="chip-menu chip-menu-wide hidden" id="pop-remind" role="dialog" aria-label="Напоминание">
                    <input type="datetime-local" id="task-remind" title="Напоминание" />
                    <button type="button" class="chip-clear" data-clear="task-remind">Без напоминания</button>
                  </div>
                </div>

                <div class="chip-popover">
                  <button type="button" class="chip-btn" id="chip-location" aria-expanded="false" aria-controls="pop-location">
                    <span class="chip-icon" aria-hidden="true">
                      <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M8 1.2a4.8 4.8 0 0 0-4.8 4.8c0 3.6 4.8 8.8 4.8 8.8s4.8-5.2 4.8-8.8A4.8 4.8 0 0 0 8 1.2zm0 6.5a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4z"/></svg>
                    </span>
                    <span class="chip-label" id="chip-location-label">Место</span>
                  </button>
                  <div class="chip-menu chip-menu-wide hidden" id="pop-location" role="dialog" aria-label="Место">
                    <input type="text" id="task-location" placeholder="Адрес, зал, офис…" autocomplete="off" />
                    <button type="button" class="chip-clear" data-clear="task-location">Без места</button>
                  </div>
                </div>


                <div class="chip-popover hidden" id="chip-work-wrap">
                  <button type="button" class="chip-btn" id="chip-work" aria-expanded="false" aria-controls="pop-work">
                    <span class="chip-icon" aria-hidden="true">
                      <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M5 3.5h6l.8 1.5H14v8H2v-8h2.2L5 3.5zm1.2 1.5-.5 1H10.3l-.5-1H6.2zM3.5 7v4.5h9V7h-9z"/></svg>
                    </span>
                    <span class="chip-label" id="chip-work-label">Проект</span>
                  </button>
                  <div class="chip-menu chip-menu-wide hidden" id="pop-work" role="menu"></div>
                  <input type="hidden" id="task-work-project" value="" />
                </div>

                <div class="chip-popover">
                  <button type="button" class="chip-btn" id="chip-cost" aria-expanded="false" aria-controls="pop-cost">
                    <span class="chip-icon" aria-hidden="true">
                      <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M2.5 4.5h11v7h-11v-7zm1.5 1.5v4h8V6h-8zm2 3.5H5V7h1v2.5zm3 0H8V7h1.5v2.5z"/></svg>
                    </span>
                    <span class="chip-label" id="chip-cost-label">Сумма</span>
                  </button>
                  <div class="chip-menu chip-menu-wide hidden" id="pop-cost" role="dialog" aria-label="Сумма">
                    <div class="cost-type-toggle" id="task-cost-type">
                      <button type="button" class="chip-option cost-expense selected" data-set-cost-type="expense">Расход</button>
                      <button type="button" class="chip-option cost-income" data-set-cost-type="income">Доход</button>
                    </div>
                    <input type="number" id="task-cost" min="0" step="0.01" placeholder="0" inputmode="decimal" />
                    <button type="button" class="chip-clear" data-clear="task-cost">Без суммы</button>
                  </div>
                  <input type="hidden" id="task-cost-type-value" value="expense" />
                </div>
              </div>
            </div>
            <button class="btn" type="submit">Добавить</button>
          </div>
        </form>
        <div class="list" id="task-list"></div>
      </section>

      <aside id="section-panel" class="section-panel hidden" aria-live="polite">
        <div class="section-panel-inner" id="section-panel-inner"></div>
      </aside>
      </div>

      <section id="view-notes" class="panel hidden">
        <form class="composer" id="note-form">
          <input type="text" id="note-title" placeholder="Заголовок заметки" required />
          <textarea id="note-body" placeholder="Текст… планы, мысли, структура"></textarea>
          <button class="btn" type="submit">Сохранить заметку</button>
        </form>
        <div id="note-list"></div>
      </section>

      <section id="view-workouts" class="panel hidden">
        <form class="composer" id="workout-form">
          <div class="field-row">
            <input type="text" id="wo-title" placeholder="Название тренировки" value="Тренировка" />
            <input type="datetime-local" id="wo-started" />
          </div>
          <div id="wo-sets"></div>
          <div class="field-row">
            <button type="button" class="btn ghost" id="wo-add-set">+ подход</button>
            <button class="btn warn" type="submit">Записать тренировку</button>
          </div>
          <textarea id="wo-notes" placeholder="Заметки к сессии"></textarea>
        </form>
        <div id="workout-list" class="list"></div>
      </section>

      <section id="view-history" class="panel hidden">
        <div class="timeline" id="history-list"></div>
      </section>

      <section id="view-stats" class="panel hidden">
        <div class="stats-grid" id="stats-cards"></div>
        <h3 style="font-family:var(--font-display);margin:0 0 8px">30 дней</h3>
        <div class="bars" id="stats-bars"></div>
        <p class="empty" style="padding-left:0">Зелёный — задачи · оранжевый — тренировки (если в день есть)</p>
        <h3 style="font-family:var(--font-display);margin:24px 0 8px">Финансы</h3>
        <div class="stats-grid stats-grid-finance" id="finance-cards"></div>
        <div class="finance-list" id="finance-list"></div>
      </section>
    </main>
  </div>

  <script src="assets/pwa-install.js?v=1"></script>
  <script src="assets/app.js?v=35"></script>
</body>
</html>
